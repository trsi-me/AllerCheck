<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="i18n-title-key" content="meta.history">
    <title>Scan History - AllerCheck</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="main-header">
            <div class="header-content">
                <a href="index.html" class="logo">AllerCheck</a>
                <nav class="main-nav">
                    <a href="index.html" class="nav-link" data-i18n="nav.home">Home</a>
                    <a href="check.html" class="nav-link" data-i18n="nav.check">Check Product</a>
                    <a href="profile.html" class="nav-link" data-i18n="nav.profile">Profile</a>
                    <a href="history.html" class="nav-link active" data-i18n="nav.history">History</a>
                    <a href="dashboard.html" class="nav-link" data-i18n="nav.dashboard">Dashboard</a>
                    <a href="about.html" class="nav-link" data-i18n="nav.about">About</a>
                </nav>
                <div class="lang-switch" role="group" aria-label="Language">
                    <button type="button" class="lang-btn" data-set-lang="en" data-i18n="lang.switchEn">English</button>
                    <button type="button" class="lang-btn" data-set-lang="ar" data-i18n="lang.switchAr">Arabic</button>
                </div>
            </div>
        </header>
        <main class="main-wrapper single-column">
            <section class="profile-panel full-width">
                <div class="panel-content">
                    <h2 class="panel-title" data-i18n="history.title">SCAN HISTORY</h2>
                    <p class="panel-description" data-i18n="history.desc">Your recent product checks. Data is stored locally in your browser.</p>
                    <button type="button" class="btn-small" id="exportBtn" data-i18n="history.export">Export Report</button>
                    <button type="button" class="btn-small" id="clearHistoryBtn" style="margin-left:8px" data-i18n="history.clear">Clear History</button>
                    <div class="history-list" id="historyList"></div>
                    <p id="emptyHistory" style="display:none; color:var(--color-light-grey); margin-top:20px" data-i18n="history.empty">No scan history yet. Check a product to get started.</p>
                </div>
            </section>
        </main>
    </div>
    <script src="i18n.js"></script>
    <script src="history.js"></script>
</body>
</html>
